<!doctype html>
<html id="html">
<head>
    <title>Snake</title>
    <meta http-equiv='cache-control' content='no-cache'>
    <meta http-equiv='expires' content='0'>
    <meta http-equiv='pragma' content='no-cache'>
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" />
    <script src="js/global.js"></script>
    <script src="js/ntc.js"></script>
    <script src="js/jquery.min.js"></script>
    <script src="js/keyDecode.js"></script>
    <script src="js/game.js"></script>
    <script src="js/body.js"></script>
    <script src="js/kitchen.js"></script>
    <script src="js/snake.js"></script>
    <script src="js/network.js"></script>
    <script src="js/level.js"></script>
</head>
<body id="body" style="margin:auto;" onload="window.game = new game();">
<!-- Lets make the most freaken complex snake game...ever... -->

<!-- Lobby screen — visible by default, hidden after joining a room -->
<div id="lobby" style="position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#1a1a2e; color:#eee; font-family:sans-serif; z-index:5;">
    <h1 style="margin-bottom:8px; font-size:2.4em; letter-spacing:2px;">Multiplayer Snake</h1>
    <h2 style="margin-top:0; margin-bottom:24px; font-weight:normal; color:#aaa;">Select a Room</h2>
    <div id="room-list" style="display:flex; flex-direction:column; gap:10px; width:320px;"></div>
    <p id="lobby-status" style="margin-top:24px; font-size:0.85em; color:#777;">Connecting...</p>
</div>

<canvas id='canvas' width='1000' height='500' style="display:none;"></canvas>
<br>
<div id="viewport" style=" position:absolute; top:0px; margin:auto;">
    <div id="scoreboard" style="display:none; position:relative; margin: 0 auto; padding:0; top:15px;">
        <h1 id="player1" style="float:left; margin:0; padding:0; text-align: center; font-size:1.2em;">PLAYER 1 <br><span id="player1score" style="font-size:0.7em; text-align: left;">Press '1' to Join</span></h1>

        <h1 id="player2" style="float:left; margin:0; padding:0; text-align: center; font-size:1.2em; margin-left:50px;">PLAYER 2 <br><span id="player2score" style="font-size:0.7em; text-align: left;">Press '2' to Join</span></h1>

        <h1 id="player4" style="float:right; margin:0; padding:0; text-align: center; font-size:1.2em; margin-left:50px;">PLAYER 4<br><span id="player4score" style="font-size:0.7em; text-align: left;">Press '4' to Join</span></h1>

        <h1 id="player3" style="float:right; margin:0; padding:0; text-align: center; font-size:1.2em;">PLAYER 3<br><span id="player3score" style="font-size:0.7em; text-align: left;">Press '3' to Join</span></h1>
    </div>

    <div id="menu" style="display:none;">
        <h2 style="text-align:center;">Multiplayer Snake</h2><br>
        <h3 id="multi" class="menu">Multiplayer</h3><br>
        <div id="serverBrowser" style="display:none; border:thin solid pink; font-size:0.8em;">
            <table id="serverTable" border="0" style="margin:auto; border-spacing:0px 5px;">
                <tr id="browserHeader" class="list">
                    <td style="padding-right:25px;">Server Name</td>
                    <td># of players</td>
                </tr>
                <tr style="text-align:center;">
                    <td><button id="back">Back</button></td>
                    <td><button id="refresh">Refresh</button></td>
                </tr>
            </table>
            <button id="connect">Connect</button>
        </div>
        <!--<button>Pratice</button><br>-->
        <h3 id="single" class="menu">Singleplayer</h3><br>
        <h3 id="settings" class="menu">Settings</h3>
    </div>
    <div id="message-container" style="position:absolute; float:left; bottom:10px; margin-left:20px;width: 300px; display:block;">
        <div id="message-log">
            <span id="m0"></span>
            <br id="m-br0">
        </div>
        <input id="message-input" disabled="disabled" placeholder="Message <Enter>" maxlength="100" />
    </div>
</div>
<!-- Chat UI — dark semi-transparent panel, bottom-right -->
<div id="chat-container" style="display:none; position:absolute; right:16px; bottom:16px; width:300px; max-height:280px; background:rgba(0,0,0,0.75); border:1px solid rgba(255,255,255,0.15); border-radius:8px; flex-direction:column; font-family:sans-serif; z-index:10;">
    <div id="chat-messages" style="flex:1; overflow-y:auto; padding:10px 12px; min-height:60px; max-height:200px; color:#ddd; font-size:0.85em; line-height:1.45;">
    </div>
    <input id="chat-input" type="text" placeholder="Type message… Enter to send" maxlength="200" style="width:calc(100% - 16px); margin:0 8px 8px; padding:8px 10px; border:1px solid rgba(255,255,255,0.2); border-radius:4px; background:rgba(255,255,255,0.08); color:#eee; font-size:0.85em; outline:none;" />
</div>

<script>
    // Wire Enter-to-send on the chat input (game.network is available globally once connected)
    document.addEventListener('DOMContentLoaded', function() {
        var chatInput = document.getElementById('chat-input');
        if (!chatInput) return;

        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && this.value.trim().length > 0 && game && game.network) {
                e.preventDefault();
                game.network.sendChat(this.value.trim());
                this.value = '';
            }
        });

        // Also listen for incoming chat messages and display them in the new UI
        if (window.addEventListener) {
            var origOnWelcome = null; // we hook into network events after it's created

            // Poll once to attach our handler when game.network exists
            var tryAttach = setInterval(function() {
                if (!game || !game.network) return;
                clearInterval(tryAttach);

                game.network.on('chat', function(msg) {
                    var container = document.getElementById('chat-messages');
                    if (!container) return;

                    var playerColor = '#fff';
                    if (msg.color) {
                        if (typeof msg.color === 'string') {
                            playerColor = msg.color;
                        } else if (msg.color.r !== undefined) {
                            playerColor = 'rgb(' + msg.color.r + ',' + msg.color.g + ',' + msg.color.b + ')';
                        }
                    }

                    var line = document.createElement('div');
                    line.style.marginBottom = '3px';

                    var nameSpan = document.createElement('span');
                    nameSpan.textContent = msg.playerId + ': ';
                    nameSpan.style.color = playerColor;
                    nameSpan.style.fontWeight = 'bold';

                    line.appendChild(nameSpan);
                    line.appendChild(document.createTextNode(msg.message));
                    container.appendChild(line);

                    while (container.children.length > 50) {
                        container.removeChild(container.firstChild);
                    }
                    container.scrollTop = container.scrollHeight;
                });
            }, 100);
        }
    });
</script>

<!--<div id="keypress" style="left:50%;"><span id="input0"></span></div>-->
</body>
</html>
